<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Киберкладбище AR/3D</title>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js"
            }
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #050510;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: manipulation;
        }

        #cameraVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            display: none;
            background: #000;
        }

        #cameraVideo.active {
            display: block;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: none;
        }

        canvas.active {
            display: block;
        }

        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050510;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
            padding: 20px;
        }

        .start-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .start-icon {
            font-size: 4rem;
            margin-bottom: 0.5rem;
        }

        .start-title {
            color: #00f7ff;
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-shadow: 0 0 20px #00f7ff;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .start-subtitle {
            color: #667788;
            font-size: 0.7rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .mode-selector {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 280px;
        }

        .mode-btn {
            background: rgba(10, 10, 26, 0.9);
            border: 2px solid rgba(0, 247, 255, 0.3);
            color: #00f7ff;
            padding: 14px 16px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 8px;
            text-shadow: 0 0 8px #00f7ff;
            text-align: center;
            touch-action: manipulation;
            pointer-events: auto;
            position: relative;
            z-index: 1000;
        }

        .mode-btn:active {
            background: rgba(0, 247, 255, 0.2);
            transform: scale(0.97);
        }

        .mode-btn.ar-btn {
            border-color: #ff00ff;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 0.65rem;
            margin-top: 0.5rem;
            text-align: center;
            max-width: 280px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        .top-bar {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(5, 5, 16, 0.8);
            border: 1px solid rgba(0, 247, 255, 0.2);
            border-radius: 8px;
            padding: 6px 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .top-bar.visible {
            opacity: 1;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #39ff14;
            border-radius: 50%;
            box-shadow: 0 0 6px #39ff14;
            animation: dotPulse 1.5s infinite;
        }

        @keyframes dotPulse {
            0%, 100% { box-shadow: 0 0 5px #39ff14; }
            50% { box-shadow: 0 0 18px #39ff14; }
        }

        .top-title {
            color: #00f7ff;
            font-size: 0.7rem;
            letter-spacing: 2px;
        }

        .mode-indicator {
            color: #ff00ff;
            font-size: 0.6rem;
            padding: 2px 6px;
            border: 1px solid rgba(255, 0, 255, 0.3);
            border-radius: 10px;
        }

        .ar-reticle {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .ar-reticle.visible {
            opacity: 1;
        }

        .ar-reticle::before,
        .ar-reticle::after {
            content: '';
            position: absolute;
            background: #ff00ff;
            box-shadow: 0 0 8px #ff00ff;
        }

        .ar-reticle::before {
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            transform: translateX(-50%);
        }

        .ar-reticle::after {
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            transform: translateY(-50%);
        }

        .bottom-bar {
            position: fixed;
            bottom: 12px;
            left: 10px;
            right: 10px;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .bottom-bar.visible {
            opacity: 1;
        }

        .product-row {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding: 4px 0;
            pointer-events: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .product-row::-webkit-scrollbar {
            display: none;
        }

        .product-chip {
            flex-shrink: 0;
            background: rgba(10, 10, 26, 0.9);
            border: 1px solid rgba(0, 247, 255, 0.2);
            border-radius: 15px;
            padding: 8px 12px;
            color: #aabbcc;
            font-size: 0.6rem;
            cursor: pointer;
            white-space: nowrap;
            touch-action: manipulation;
            pointer-events: auto;
            transition: all 0.3s;
        }

        .product-chip.active {
            border-color: #00f7ff;
            box-shadow: 0 0 10px rgba(0, 247, 255, 0.3);
            color: #00f7ff;
            background: rgba(0, 247, 255, 0.1);
        }

        .action-row {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            pointer-events: auto;
        }

        .place-btn {
            flex: 1;
            background: rgba(0, 247, 255, 0.1);
            border: 2px solid #00f7ff;
            color: #00f7ff;
            padding: 12px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 8px;
            text-shadow: 0 0 5px #00f7ff;
            touch-action: manipulation;
            pointer-events: auto;
            transition: all 0.3s;
        }

        .place-btn:active {
            background: rgba(0, 247, 255, 0.3);
            transform: scale(0.97);
        }

        .clear-btn {
            background: rgba(255, 80, 80, 0.1);
            border: 2px solid rgba(255, 80, 80, 0.5);
            color: #ff6b6b;
            padding: 12px 14px;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 8px;
            touch-action: manipulation;
            pointer-events: auto;
            transition: all 0.3s;
        }

        .hint {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.55rem;
            margin-top: 4px;
            pointer-events: none;
        }

        .counter {
            position: fixed;
            top: 50px;
            right: 10px;
            background: rgba(5, 5, 16, 0.8);
            border: 1px solid rgba(255, 0, 255, 0.3);
            border-radius: 15px;
            padding: 6px 14px;
            color: #ff00ff;
            font-size: 0.7rem;
            z-index: 50;
            pointer-events: auto;
            cursor: pointer;
            opacity: 0;
            transition: all 0.3s;
            text-shadow: 0 0 6px #ff00ff;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .counter.visible {
            opacity: 1;
        }

        .counter:active {
            background: rgba(255, 0, 255, 0.2);
            transform: scale(0.95);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }

        .toast {
            position: fixed;
            bottom: 160px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(5, 5, 16, 0.9);
            border: 1px solid #ff00ff;
            color: #ff00ff;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.6rem;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
        }

        /* Карточка с информацией о сервисе */
        .info-card {
            position: fixed;
            bottom: 50%;
            left: 50%;
            transform: translate(-50%, 50%);
            background: rgba(5, 5, 16, 0.95);
            border: 2px solid #ff00ff;
            border-radius: 15px;
            padding: 20px;
            z-index: 200;
            pointer-events: auto;
            opacity: 0;
            transition: all 0.3s;
            text-align: center;
            min-width: 250px;
            max-width: 300px;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .info-card.visible {
            opacity: 1;
        }

        .info-card-emoji {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .info-card-name {
            color: #00f7ff;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #00f7ff;
        }

        .info-card-years {
            color: #aabbcc;
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        .info-card-cause {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
        }

        .info-card-close {
            background: rgba(255, 0, 255, 0.2);
            border: 1px solid #ff00ff;
            color: #ff00ff;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            touch-action: manipulation;
        }

        .info-card-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 199;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .info-card-overlay.visible {
            opacity: 1;
        }
    </style>
</head>
<body>

    <video id="cameraVideo" autoplay playsinline muted></video>
    <canvas id="canvas3D"></canvas>

    <div class="start-screen" id="startScreen">
        <div class="start-icon">🪦</div>
        <div class="start-title">КИБЕРКЛАДБИЩЕ</div>
        <div class="start-subtitle">Выберите режим работы</div>
        <div class="mode-selector">
            <button class="mode-btn ar-btn" id="arModeBtn">📷 AR РЕЖИМ</button>
            <button class="mode-btn" id="d3ModeBtn">🌐 3D РЕЖИМ</button>
        </div>
        <div class="error-msg" id="errorMsg"></div>
    </div>

    <div class="top-bar" id="topBar">
        <div style="display:flex;align-items:center;gap:6px;">
            <div class="dot"></div>
            <span class="top-title">КИБЕРКЛАДБИЩЕ</span>
        </div>
        <span class="mode-indicator" id="modeIndicator">3D</span>
    </div>

    <div class="ar-reticle" id="arReticle"></div>
    <div class="counter" id="counter">🪦 0</div>
    <div class="toast" id="toast"></div>

    <!-- Карточка информации -->
    <div class="info-card-overlay" id="infoOverlay"></div>
    <div class="info-card" id="infoCard">
        <div class="info-card-emoji" id="infoEmoji"></div>
        <div class="info-card-name" id="infoName"></div>
        <div class="info-card-years" id="infoYears"></div>
        <div class="info-card-cause" id="infoCause"></div>
        <button class="info-card-close" id="infoClose">ЗАКРЫТЬ</button>
    </div>

    <div class="bottom-bar" id="bottomBar">
        <div class="product-row" id="productRow">
            <span class="product-chip active" data-id="skype">📞 Skype</span>
            <span class="product-chip" data-id="flash">⚡ Flash</span>
            <span class="product-chip" data-id="vine">🎥 Vine</span>
            <span class="product-chip" data-id="googleplus">🔵 Google+</span>
            <span class="product-chip" data-id="winphone">📱 WinPhone</span>
            <span class="product-chip" data-id="yahoo">💬 Yahoo</span>
            <span class="product-chip" data-id="periscope">📡 Periscope</span>
            <span class="product-chip" data-id="clubhouse">🎙️ Clubhouse</span>
        </div>
        <div class="action-row">
            <button class="place-btn" id="placeBtn">[ УСТАНОВИТЬ ]</button>
            <button class="clear-btn" id="clearBtn">✕</button>
        </div>
        <div class="hint">Нажмите УСТАНОВИТЬ для размещения</div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // ============ ДАННЫЕ ============
        const PRODUCTS = {
            skype:      { name: 'SKYPE',     years: '2003-2025', cause: 'УБИТ MICROSOFT',  color: '#4da6ff', emoji: '📞', description: 'Легендарный мессенджер, купленный Microsoft за $8.5 млрд и закрытый в мае 2025' },
            flash:      { name: 'FLASH',     years: '1996-2020', cause: 'УБИТ APPLE',      color: '#ff5555', emoji: '⚡', description: 'Технология, создавшая интернет-анимацию. Стив Джобс отказался от неё в iPhone' },
            vine:       { name: 'VINE',      years: '2013-2017', cause: 'УБИТ TIKTOK',     color: '#39ff14', emoji: '🎥', description: 'Первый сервис коротких видео. 6-секундные ролики захватили мир' },
            googleplus: { name: 'GOOGLE+',   years: '2011-2019', cause: 'НИКОМУ НЕ НУЖЕН', color: '#ff4444', emoji: '🔵', description: 'Социальная сеть от Google, которую пытались навязать пользователям YouTube' },
            winphone:   { name: 'WIN PHONE', years: '2010-2019', cause: 'БЕЗ ПРИЛОЖЕНИЙ',  color: '#00a4ef', emoji: '📱', description: 'Мобильная ОС с уникальным дизайном. Разработчики не создавали приложения' },
            yahoo:      { name: 'YAHOO MSG', years: '1998-2018', cause: 'ЭПОХА УШЛА',      color: '#9b59b6', emoji: '💬', description: 'Первый массовый мессенджер. Чат-комнаты и аська были символами эпохи' },
            periscope:  { name: 'PERISCOPE', years: '2015-2021', cause: 'ЭФИР ОПУСТЕЛ',    color: '#e74c3c', emoji: '📡', description: 'Сервис прямых трансляций от Twitter. Не выдержал конкуренции' },
            clubhouse:  { name: 'CLUBHOUSE', years: '2020-2023', cause: 'ТИШИНА',          color: '#f39c12', emoji: '🎙️', description: 'Аудио-соцсеть, взорвавшая рынок в пандемию. Мода прошла быстро' }
        };

        // ============ СОСТОЯНИЕ ============
        let selectedProduct = 'skype';
        let currentMode = '';
        let cameraStream = null;
        let tombstones = [];
        let currentViewIndex = 0;
        let isAnimating = false;
        let selectedTombstone = null;
        
        // ============ THREE.JS ============
        const canvas = document.getElementById('canvas3D');
        const renderer = new THREE.WebGLRenderer({ 
            canvas: canvas,
            alpha: true,
            antialias: true,
            powerPreference: 'high-performance'
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x050510, 5, 20);
        
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.set(0, 1.6, 0);
        
        // Освещение
        const ambientLight = new THREE.AmbientLight(0x222244, 0.6);
        scene.add(ambientLight);
        
        const moonLight = new THREE.DirectionalLight(0x4466aa, 0.4);
        moonLight.position.set(-5, 5, -3);
        scene.add(moonLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.3);
        dirLight.position.set(1, 3, 2);
        scene.add(dirLight);
        
        // Пол для 3D режима
        const groundGeometry = new THREE.PlaneGeometry(30, 30);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x0a0a1e,
            roughness: 0.9,
            metalness: 0.1
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.visible = false;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // Сетка на полу
        const gridHelper = new THREE.PolarGridHelper(15, 32, 24, 64, 0x00f7ff, 0x00f7ff);
        gridHelper.position.y = 0.01;
        gridHelper.visible = false;
        scene.add(gridHelper);
        
        // Частицы тумана
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 200;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i += 3) {
            posArray[i] = (Math.random() - 0.5) * 20;
            posArray[i+1] = Math.random() * 3;
            posArray[i+2] = (Math.random() - 0.5) * 20;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.02,
            color: 0x00f7ff,
            transparent: true,
            opacity: 0.3
        });
        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);
        
        // ============ DOM ============
        const startScreen = document.getElementById('startScreen');
        const cameraVideo = document.getElementById('cameraVideo');
        const arReticle = document.getElementById('arReticle');
        const topBar = document.getElementById('topBar');
        const bottomBar = document.getElementById('bottomBar');
        const counterEl = document.getElementById('counter');
        const modeIndicator = document.getElementById('modeIndicator');
        const toast = document.getElementById('toast');
        const errorMsg = document.getElementById('errorMsg');
        const infoCard = document.getElementById('infoCard');
        const infoOverlay = document.getElementById('infoOverlay');
        const infoEmoji = document.getElementById('infoEmoji');
        const infoName = document.getElementById('infoName');
        const infoYears = document.getElementById('infoYears');
        const infoCause = document.getElementById('infoCause');
        
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 2000);
        }
        
        function updateCounter() {
            counterEl.textContent = '🪦 ' + tombstones.length;
        }
        
        function showInfoCard(productId) {
            const p = PRODUCTS[productId];
            infoEmoji.textContent = p.emoji;
            infoName.textContent = p.name;
            infoYears.textContent = p.years;
            infoCause.textContent = p.cause;
            infoCard.classList.add('visible');
            infoOverlay.classList.add('visible');
            if (navigator.vibrate) navigator.vibrate(30);
        }
        
        function hideInfoCard() {
            infoCard.classList.remove('visible');
            infoOverlay.classList.remove('visible');
        }
        
        // ============ СОЗДАНИЕ КРАСИВОГО НАДГРОБИЯ ============
        function createTombstoneMesh(productId) {
            const p = PRODUCTS[productId];
            const group = new THREE.Group();
            const color = new THREE.Color(p.color);
            
            // Постамент (основание)
            const baseGeo = new THREE.BoxGeometry(2.2, 0.4, 1);
            const baseMat = new THREE.MeshStandardMaterial({ 
                color: 0x1a1a2e,
                roughness: 0.4,
                metalness: 0.6
            });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 0.2;
            base.castShadow = true;
            base.receiveShadow = true;
            group.add(base);
            
            // Декоративная полоска на постаменте
            const stripeGeo = new THREE.BoxGeometry(2.3, 0.1, 1.1);
            const stripeMat = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.8,
                roughness: 0.2,
                metalness: 0.8
            });
            const stripe = new THREE.Mesh(stripeGeo, stripeMat);
            stripe.position.y = 0.4;
            group.add(stripe);
            
            // Основная плита (надгробие)
            const stoneGeo = new THREE.BoxGeometry(1.8, 2.8, 0.4);
            const stoneMat = new THREE.MeshStandardMaterial({ 
                color: 0x2a2a3e,
                roughness: 0.3,
                metalness: 0.5
            });
            const stone = new THREE.Mesh(stoneGeo, stoneMat);
            stone.position.y = 1.8;
            stone.castShadow = true;
            stone.receiveShadow = true;
            group.add(stone);
            
            // Верхняя часть (полукруглая)
            const topGeo = new THREE.CylinderGeometry(0.9, 0.9, 0.3, 16);
            const topMat = new THREE.MeshStandardMaterial({
                color: 0x2a2a3e,
                roughness: 0.3,
                metalness: 0.5
            });
            const top = new THREE.Mesh(topGeo, topMat);
            top.position.y = 3.2;
            group.add(top);
            
            // Неоновая рамка
            const frameGeo = new THREE.BoxGeometry(2, 3, 0.05);
            const frameMat = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 2,
                roughness: 0.1,
                metalness: 0.9
            });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.position.set(0, 1.85, -0.2);
            group.add(frame);
            
            // Свечение вокруг рамки
            const glowGeo = new THREE.BoxGeometry(2.2, 3.2, 0.02);
            const glowMat = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.3,
                side: THREE.DoubleSide
            });
            const glow = new THREE.Mesh(glowGeo, glowMat);
            glow.position.set(0, 1.85, -0.22);
            group.add(glow);
            
            // Свечение снизу (подсветка земли)
            const groundGlowGeo = new THREE.PlaneGeometry(3, 2);
            const groundGlowMat = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.2,
                side: THREE.DoubleSide
            });
            const groundGlow = new THREE.Mesh(groundGlowGeo, groundGlowMat);
            groundGlow.rotation.x = -Math.PI / 2;
            groundGlow.position.y = 0.01;
            group.add(groundGlow);
            
            // Точечный источник света
            const pointLight = new THREE.PointLight(color, 0.4, 5);
            pointLight.position.set(0, 1.5, 0.5);
            group.add(pointLight);
            
            group.userData = { 
                color: p.color, 
                name: p.name,
                productId: productId
            };
            group.scale.set(0.1, 0.1, 0.1);
            
            return group;
        }
        
        function placeInitialTombstones() {
            tombstones.forEach(t => scene.remove(t));
            tombstones = [];
            currentViewIndex = 0;
            
            const positions = [
                { product: 'flash',      x: 0,    z: -4 },
                { product: 'skype',      x: -2.5, z: -3.5 },
                { product: 'vine',       x: 2.5,  z: -3.5 },
                { product: 'googleplus', x: -4,   z: -5 },
                { product: 'winphone',   x: 4,    z: -5 },
                { product: 'yahoo',      x: -1.5, z: -6 },
                { product: 'periscope',  x: 1.5,  z: -6 }
            ];
            
            positions.forEach(pos => {
                const mesh = createTombstoneMesh(pos.product);
                mesh.position.set(pos.x, 0, pos.z);
                scene.add(mesh);
                tombstones.push(mesh);
            });
            
            updateCounter();
        }
        
        function placeNewTombstone() {
            const mesh = createTombstoneMesh(selectedProduct);
            
            const direction = new THREE.Vector3(0, 0, -1);
            direction.applyQuaternion(camera.quaternion);
            
            const distance = currentMode === 'ar' ? 3 : 3;
            mesh.position.copy(camera.position).add(direction.multiplyScalar(distance));
            mesh.position.y = currentMode === 'ar' ? camera.position.y - 0.5 : 0;
            
            mesh.lookAt(camera.position.x, mesh.position.y, camera.position.z);
            
            scene.add(mesh);
            tombstones.push(mesh);
            
            if (tombstones.length > 25) {
                scene.remove(tombstones[0]);
                tombstones.shift();
            }
            
            updateCounter();
            showToast('🪦 ' + PRODUCTS[selectedProduct].name + ' установлен!');
            
            if (navigator.vibrate) navigator.vibrate(20);
        }
        
        function clearAll() {
            tombstones.forEach(t => scene.remove(t));
            tombstones = [];
            currentViewIndex = 0;
            updateCounter();
            showToast('🧹 Кладбище очищено');
            if (navigator.vibrate) navigator.vibrate(50);
        }
        
        // ============ ПЕРЕЛЁТ К НАДГРОБИЮ ============
        function flyToTombstone(index) {
            if (tombstones.length === 0 || isAnimating) return;
            
            isAnimating = true;
            const target = tombstones[index];
            const targetPos = target.position.clone();
            
            const cameraTargetPos = targetPos.clone()
                .add(new THREE.Vector3(0, 2, 0))
                .add(new THREE.Vector3(0, 0, -3));
            
            const startPos = camera.position.clone();
            const startTime = Date.now();
            const duration = 1000;
            
            function animateFly() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const ease = progress < 0.5 
                    ? 2 * progress * progress 
                    : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                
                camera.position.lerpVectors(startPos, cameraTargetPos, ease);
                camera.lookAt(targetPos.x, targetPos.y + 1.5, targetPos.z);
                
                if (progress < 1) {
                    requestAnimationFrame(animateFly);
                } else {
                    isAnimating = false;
                    showToast('🪦 ' + PRODUCTS[target.userData.productId].name);
                    if (navigator.vibrate) navigator.vibrate(30);
                }
            }
            
            animateFly();
        }
        
        function flyToNextTombstone() {
            if (tombstones.length === 0) {
                showToast('🪦 Нет надгробий для просмотра');
                return;
            }
            
            const index = currentViewIndex % tombstones.length;
            flyToTombstone(index);
            currentViewIndex = (currentViewIndex + 1) % tombstones.length;
        }
        
        // ============ ОБРАБОТКА КЛИКОВ ПО НАДГРОБИЯМ ============
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        function onCanvasClick(event) {
            if (isAnimating) return;
            
            // Получаем координаты клика
            const rect = canvas.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(tombstones, true);
            
            if (intersects.length > 0) {
                // Нашли надгробие
                let obj = intersects[0].object;
                while (obj && !obj.userData.productId) {
                    obj = obj.parent;
                }
                if (obj && obj.userData.productId) {
                    showInfoCard(obj.userData.productId);
                }
            }
        }
        
        canvas.addEventListener('click', onCanvasClick);
        canvas.addEventListener('touchend', (e) => {
            if (e.target === canvas) {
                onCanvasClick(e.changedTouches[0]);
            }
        });
        
        function start3DMode() {
            currentMode = '3d';
            startScreen.classList.add('hidden');
            canvas.classList.add('active');
            cameraVideo.classList.remove('active');
            topBar.classList.add('visible');
            bottomBar.classList.add('visible');
            counterEl.classList.add('visible');
            arReticle.classList.remove('visible');
            
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.Fog(0x050510, 5, 20);
            ground.visible = true;
            gridHelper.visible = true;
            camera.position.set(0, 1.6, 0);
            modeIndicator.textContent = '3D 🌐';
            showToast('🌐 3D режим');
            
            placeInitialTombstones();
        }
        
        async function startARMode() {
            errorMsg.classList.remove('show');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                });
                
                cameraStream = stream;
                cameraVideo.srcObject = stream;
                await cameraVideo.play();
                
                currentMode = 'ar';
                startScreen.classList.add('hidden');
                canvas.classList.add('active');
                cameraVideo.classList.add('active');
                topBar.classList.add('visible');
                bottomBar.classList.add('visible');
                counterEl.classList.add('visible');
                arReticle.classList.add('visible');
                
                scene.background = null;
                scene.fog = null;
                renderer.setClearColor(0x000000, 0);
                ground.visible = false;
                gridHelper.visible = false;
                camera.position.set(0, 1.6, 0);
                modeIndicator.textContent = 'AR 📷';
                showToast('📷 AR режим');
                
                setTimeout(placeInitialTombstones, 500);
                
            } catch (e) {
                errorMsg.textContent = '⚠ Ошибка камеры. Используйте 3D режим.';
                errorMsg.classList.add('show');
            }
        }
        
        // ============ ГИРОСКОП ДЛЯ AR ============
        let initialOrientation = null;
        
        function handleOrientation(event) {
            if (currentMode !== 'ar' || isAnimating) return;
            
            if (!initialOrientation) {
                initialOrientation = {
                    alpha: event.alpha || 0,
                    beta: event.beta || 0,
                    gamma: event.gamma || 0
                };
            }
            
            const alpha = ((event.alpha || 0) - initialOrientation.alpha) * Math.PI / 180;
            const beta = ((event.beta || 0) - initialOrientation.beta) * Math.PI / 180;
            const gamma = ((event.gamma || 0) - initialOrientation.gamma) * Math.PI / 180;
            
            const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
            camera.quaternion.setFromEuler(euler);
        }
        
        window.addEventListener('deviceorientation', handleOrientation, true);
        
        // ============ ОБРАБОТЧИКИ ============
        document.getElementById('d3ModeBtn').addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            start3DMode();
        });
        
        document.getElementById('arModeBtn').addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            startARMode();
        });
        
        document.getElementById('placeBtn').addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (currentMode) placeNewTombstone();
        });
        
        document.getElementById('clearBtn').addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            clearAll();
        });
        
        counterEl.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            flyToNextTombstone();
        });
        
        counterEl.addEventListener('touchend', (e) => {
            e.preventDefault();
            e.stopPropagation();
            flyToNextTombstone();
        });
        
        document.getElementById('infoClose').addEventListener('click', hideInfoCard);
        infoOverlay.addEventListener('click', hideInfoCard);
        
        document.getElementById('productRow').addEventListener('click', (e) => {
            const chip = e.target.closest('.product-chip');
            if (!chip) return;
            document.querySelectorAll('.product-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            selectedProduct = chip.dataset.id;
            if (navigator.vibrate) navigator.vibrate(10);
        });
        
        // ============ АНИМАЦИЯ ============
        function animate() {
            requestAnimationFrame(animate);
            
            // Анимация появления надгробий
            tombstones.forEach(tombstone => {
                if (tombstone.scale.x < 0.5) {
                    tombstone.scale.x += 0.05;
                    tombstone.scale.y += 0.05;
                    tombstone.scale.z += 0.05;
                    if (tombstone.scale.x > 0.5) {
                        tombstone.scale.set(0.5, 0.5, 0.5);
                    }
                }
            });
            
            // Анимация частиц тумана
            particles.rotation.y += 0.0002;
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        window.addEventListener('beforeunload', () => {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
            }
        });
        
        console.log('🪦 Киберкладбище загружено');
        console.log('👆 Кликайте на надгробия для информации');
        console.log('👆 Нажмите на счётчик 🪦 для облёта');
    </script>
</body>
</html>
