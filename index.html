<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Киберкладбище AR/3D | Некрополь цифровых легенд</title>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js"
            }
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #050510;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: manipulation;
        }

        #cameraVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            display: none;
            background: #000;
        }

        #cameraVideo.active {
            display: block;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: none;
        }

        canvas.active {
            display: block;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050510;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
            opacity: 0;
            pointer-events: none;
        }
        .loading-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 247, 255, 0.2);
            border-top-color: #00f7ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050510;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
            padding: 20px;
        }

        .start-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .start-icon {
            font-size: 4rem;
            margin-bottom: 0.5rem;
            animation: float 3s ease-in-out infinite;
        }

        .start-title {
            color: #00f7ff;
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-shadow: 0 0 20px #00f7ff;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .start-subtitle {
            color: #667788;
            font-size: 0.7rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .mode-selector {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 280px;
        }

        .mode-btn {
            background: rgba(10, 10, 26, 0.9);
            border: 2px solid rgba(0, 247, 255, 0.3);
            color: #00f7ff;
            padding: 14px 16px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 8px;
            text-shadow: 0 0 8px #00f7ff;
            text-align: center;
            touch-action: manipulation;
            pointer-events: auto;
            position: relative;
            z-index: 1000;
            transition: all 0.2s;
        }

        .mode-btn:active {
            background: rgba(0, 247, 255, 0.2);
            transform: scale(0.97);
        }

        .mode-btn.ar-btn {
            border-color: #ff00ff;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 0.65rem;
            margin-top: 0.5rem;
            text-align: center;
            max-width: 280px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        .top-bar {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(5, 5, 16, 0.8);
            border: 1px solid rgba(0, 247, 255, 0.2);
            border-radius: 8px;
            padding: 6px 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .top-bar.visible {
            opacity: 1;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #39ff14;
            border-radius: 50%;
            box-shadow: 0 0 6px #39ff14;
            animation: dotPulse 1.5s infinite;
        }

        @keyframes dotPulse {
            0%, 100% { box-shadow: 0 0 5px #39ff14; }
            50% { box-shadow: 0 0 18px #39ff14; }
        }

        .top-title {
            color: #00f7ff;
            font-size: 0.7rem;
            letter-spacing: 2px;
        }

        .mode-indicator {
            color: #ff00ff;
            font-size: 0.6rem;
            padding: 2px 6px;
            border: 1px solid rgba(255, 0, 255, 0.3);
            border-radius: 10px;
        }

        .ar-reticle {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .ar-reticle.visible {
            opacity: 1;
        }

        .ar-reticle::before,
        .ar-reticle::after {
            content: '';
            position: absolute;
            background: #ff00ff;
            box-shadow: 0 0 8px #ff00ff;
        }

        .ar-reticle::before {
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            transform: translateX(-50%);
        }

        .ar-reticle::after {
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            transform: translateY(-50%);
        }

        .bottom-bar {
            position: fixed;
            bottom: 12px;
            left: 10px;
            right: 10px;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .bottom-bar.visible {
            opacity: 1;
        }

        .product-row {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding: 4px 0;
            pointer-events: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .product-row::-webkit-scrollbar {
            display: none;
        }

        .product-chip {
            flex-shrink: 0;
            background: rgba(10, 10, 26, 0.9);
            border: 1px solid rgba(0, 247, 255, 0.2);
            border-radius: 15px;
            padding: 8px 12px;
            color: #aabbcc;
            font-size: 0.6rem;
            cursor: pointer;
            white-space: nowrap;
            touch-action: manipulation;
            pointer-events: auto;
            transition: all 0.3s;
        }

        .product-chip.active {
            border-color: #00f7ff;
            box-shadow: 0 0 10px rgba(0, 247, 255, 0.3);
            color: #00f7ff;
            background: rgba(0, 247, 255, 0.1);
        }

        .action-row {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            pointer-events: auto;
        }

        .place-btn {
            flex: 1;
            background: rgba(0, 247, 255, 0.1);
            border: 2px solid #00f7ff;
            color: #00f7ff;
            padding: 12px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 8px;
            text-shadow: 0 0 5px #00f7ff;
            touch-action: manipulation;
            pointer-events: auto;
            transition: all 0.3s;
        }

        .place-btn:active {
            background: rgba(0, 247, 255, 0.3);
            transform: scale(0.97);
        }

        .clear-btn {
            background: rgba(255, 80, 80, 0.1);
            border: 2px solid rgba(255, 80, 80, 0.5);
            color: #ff6b6b;
            padding: 12px 14px;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 8px;
            touch-action: manipulation;
            pointer-events: auto;
            transition: all 0.3s;
        }

        .hint {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.55rem;
            margin-top: 4px;
            pointer-events: none;
        }

        .counter {
            position: fixed;
            top: 50px;
            right: 10px;
            background: rgba(5, 5, 16, 0.8);
            border: 1px solid rgba(255, 0, 255, 0.3);
            border-radius: 15px;
            padding: 6px 14px;
            color: #ff00ff;
            font-size: 0.7rem;
            z-index: 150;
            pointer-events: auto;
            cursor: pointer;
            opacity: 0;
            transition: all 0.3s;
            text-shadow: 0 0 6px #ff00ff;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .counter.visible {
            opacity: 1;
        }

        .counter:active {
            background: rgba(255, 0, 255, 0.2);
            transform: scale(0.95);
        }

        .toast {
            position: fixed;
            bottom: 160px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(5, 5, 16, 0.9);
            border: 1px solid #ff00ff;
            color: #ff00ff;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.6rem;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
        }

        .info-card-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 200;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.3s;
            display: none;
        }

        .info-card-overlay.visible {
            opacity: 1;
            display: block;
        }

        .info-card {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 5, 16, 0.98);
            border: 2px solid #ff00ff;
            border-radius: 15px;
            padding: 25px 20px;
            z-index: 201;
            pointer-events: auto;
            opacity: 0;
            transition: all 0.3s;
            text-align: center;
            min-width: 280px;
            max-width: 320px;
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.4), 0 0 80px rgba(0, 247, 255, 0.2);
            display: none;
        }

        .info-card.visible {
            opacity: 1;
            display: block;
        }

        .info-card-emoji {
            font-size: 3.5rem;
            margin-bottom: 10px;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .info-card-name {
            color: #00f7ff;
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #00f7ff;
        }

        .info-card-years {
            color: #aabbcc;
            font-size: 0.85rem;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .info-card-cause {
            color: #ff6b6b;
            font-size: 1rem;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
            letter-spacing: 1px;
        }

        .info-card-description {
            color: #8899aa;
            font-size: 0.75rem;
            margin-bottom: 20px;
            line-height: 1.5;
            padding: 0 10px;
        }

        .info-card-close {
            background: rgba(255, 0, 255, 0.15);
            border: 2px solid #ff00ff;
            color: #ff00ff;
            padding: 10px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            letter-spacing: 2px;
            touch-action: manipulation;
            transition: all 0.3s;
            width: 100%;
            max-width: 200px;
        }

        .info-card-close:hover {
            background: rgba(255, 0, 255, 0.3);
            transform: scale(1.02);
        }

        .info-card-close:active {
            background: rgba(255, 0, 255, 0.4);
            transform: scale(0.95);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }
    </style>
</head>
<body>

    <video id="cameraVideo" autoplay playsinline muted></video>
    <canvas id="canvas3D"></canvas>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <div class="start-screen" id="startScreen">
        <div class="start-icon">🪦</div>
        <div class="start-title">КИБЕРКЛАДБИЩЕ</div>
        <div class="start-subtitle">Выберите режим работы</div>
        <div class="mode-selector">
            <button class="mode-btn ar-btn" id="arModeBtn">📷 AR РЕЖИМ</button>
            <button class="mode-btn" id="d3ModeBtn">🌐 3D РЕЖИМ</button>
        </div>
        <div class="error-msg" id="errorMsg"></div>
    </div>

    <div class="top-bar" id="topBar">
        <div style="display:flex;align-items:center;gap:6px;">
            <div class="dot"></div>
            <span class="top-title">КИБЕРКЛАДБИЩЕ</span>
        </div>
        <span class="mode-indicator" id="modeIndicator">3D</span>
    </div>

    <div class="ar-reticle" id="arReticle"></div>
    <div class="counter" id="counter">🪦 0</div>
    <div class="toast" id="toast"></div>

    <div class="info-card-overlay" id="infoOverlay"></div>
    <div class="info-card" id="infoCard">
        <div class="info-card-emoji" id="infoEmoji"></div>
        <div class="info-card-name" id="infoName"></div>
        <div class="info-card-years" id="infoYears"></div>
        <div class="info-card-cause" id="infoCause"></div>
        <div class="info-card-description" id="infoDescription"></div>
        <button class="info-card-close" id="infoCloseBtn">ЗАКРЫТЬ</button>
    </div>

    <div class="bottom-bar" id="bottomBar">
        <div class="product-row" id="productRow">
            <span class="product-chip active" data-id="skype">📞 Skype</span>
            <span class="product-chip" data-id="flash">⚡ Flash</span>
            <span class="product-chip" data-id="vine">🎥 Vine</span>
            <span class="product-chip" data-id="googleplus">🔵 Google+</span>
            <span class="product-chip" data-id="winphone">📱 WinPhone</span>
            <span class="product-chip" data-id="yahoo">💬 Yahoo</span>
            <span class="product-chip" data-id="periscope">📡 Periscope</span>
            <span class="product-chip" data-id="clubhouse">🎙️ Clubhouse</span>
        </div>
        <div class="action-row">
            <button class="place-btn" id="placeBtn">[ УСТАНОВИТЬ ]</button>
            <button class="clear-btn" id="clearBtn">✕</button>
        </div>
        <div class="hint">Нажмите УСТАНОВИТЬ для размещения</div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        const PRODUCTS = {
            skype:      { name: 'SKYPE',     years: '2003-2025', cause: 'УБИТ MICROSOFT',  color: '#4da6ff', emoji: '📞', description: 'Легендарный мессенджер, купленный Microsoft за $8.5 млрд. Закрыт в мае 2025 года после 22 лет работы.' },
            flash:      { name: 'FLASH',     years: '1996-2020', cause: 'УБИТ APPLE',      color: '#ff5555', emoji: '⚡', description: 'Технология, создавшая интернет-анимацию и игры. Стив Джобс отказался от неё в iPhone, что привело к гибели.' },
            vine:       { name: 'VINE',      years: '2013-2017', cause: 'УБИТ TIKTOK',     color: '#39ff14', emoji: '🎥', description: 'Первый сервис 6-секундных видео. Создал тренд, но не выдержал конкуренции с TikTok и Instagram.' },
            googleplus: { name: 'GOOGLE+',   years: '2011-2019', cause: 'НИКОМУ НЕ НУЖЕН', color: '#ff4444', emoji: '🔵', description: 'Социальная сеть от Google. Компания пыталась навязать её пользователям YouTube, но безуспешно.' },
            winphone:   { name: 'WIN PHONE', years: '2010-2019', cause: 'БЕЗ ПРИЛОЖЕНИЙ',  color: '#00a4ef', emoji: '📱', description: 'Мобильная ОС с уникальным плиточным дизайном. Разработчики не создавали приложения, и платформа умерла.' },
            yahoo:      { name: 'YAHOO MSG', years: '1998-2018', cause: 'ЭПОХА УШЛА',      color: '#9b59b6', emoji: '💬', description: 'Первый массовый мессенджер с чат-комнатами. Символ раннего интернета, не переживший эру смартфонов.' },
            periscope:  { name: 'PERISCOPE', years: '2015-2021', cause: 'ЭФИР ОПУСТЕЛ',    color: '#e74c3c', emoji: '📡', description: 'Сервис прямых трансляций от Twitter. Популярность упала после появления стримов в других соцсетях.' },
            clubhouse:  { name: 'CLUBHOUSE', years: '2020-2023', cause: 'ТИШИНА',          color: '#f39c12', emoji: '🎙️', description: 'Аудио-соцсеть, взорвавшая рынок во время пандемии. Мода прошла так же быстро, как и появилась.' }
        };

        let selectedProduct = 'skype';
        let currentMode = '';
        let cameraStream = null;
        let tombstones = [];
        let currentViewIndex = 0;
        let isAnimating = false;
        let isDragging = false;
        let lastTouchX = 0, lastTouchY = 0;
        let touchStartDistance = 0;
        let initialCameraPosition = null;
        let audioContext = null;
        
        // --- Three.js setup ---
        const canvas = document.getElementById('canvas3D');
        const renderer = new THREE.WebGLRenderer({ 
            canvas: canvas,
            alpha: true,
            antialias: true,
            powerPreference: 'high-performance'
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.set(0, 1.6, 0);
        
        // Lighting
        scene.add(new THREE.AmbientLight(0x333355, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(1, 3, 2);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0x4466aa, 0.3);
        backLight.position.set(-2, 2, -3);
        scene.add(backLight);
        
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(30, 30),
            new THREE.MeshStandardMaterial({ color: 0x0a0a1e, roughness: 0.9, metalness: 0.1 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.visible = false;
        scene.add(ground);
        
        // Stars
        const starsGeo = new THREE.BufferGeometry();
        const starsPos = new Float32Array(200 * 3);
        for(let i = 0; i < 200 * 3; i += 3) {
            starsPos[i] = (Math.random() - 0.5) * 20;
            starsPos[i+1] = Math.random() * 4 + 0.5;
            starsPos[i+2] = (Math.random() - 0.5) * 20;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({ size: 0.03, color: 0x00f7ff, transparent: true, opacity: 0.4 }));
        scene.add(stars);
        
        // --- DOM elements ---
        const startScreen = document.getElementById('startScreen');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const cameraVideo = document.getElementById('cameraVideo');
        const arReticle = document.getElementById('arReticle');
        const topBar = document.getElementById('topBar');
        const bottomBar = document.getElementById('bottomBar');
        const counterEl = document.getElementById('counter');
        const modeIndicator = document.getElementById('modeIndicator');
        const toast = document.getElementById('toast');
        const errorMsg = document.getElementById('errorMsg');
        const infoCard = document.getElementById('infoCard');
        const infoOverlay = document.getElementById('infoOverlay');
        const infoEmoji = document.getElementById('infoEmoji');
        const infoName = document.getElementById('infoName');
        const infoYears = document.getElementById('infoYears');
        const infoCause = document.getElementById('infoCause');
        const infoDescription = document.getElementById('infoDescription');
        const infoCloseBtn = document.getElementById('infoCloseBtn');
        
        // --- Helpers ---
        function showLoading(show) {
            if (show) loadingOverlay.classList.add('visible');
            else loadingOverlay.classList.remove('visible');
        }

        function vibrate(pattern) {
            if (navigator.vibrate && currentMode === 'ar') navigator.vibrate(pattern);
        }

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 2000);
        }
        
        function updateCounter() {
            counterEl.textContent = '🪦 ' + tombstones.length;
        }
        
        // Функция закрытия карточки - улучшена для надёжности
        function hideInfoCard(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            infoCard.classList.remove('visible');
            infoOverlay.classList.remove('visible');
            console.log('Карточка закрыта');
        }
        
        function showInfoCard(productId) {
            const p = PRODUCTS[productId];
            if (!p) return;
            
            infoEmoji.textContent = p.emoji;
            infoName.textContent = p.name;
            infoYears.textContent = '📅 ' + p.years;
            infoCause.textContent = '💀 ' + p.cause;
            infoDescription.textContent = p.description;
            
            infoCard.classList.add('visible');
            infoOverlay.classList.add('visible');
            vibrate(30);
            console.log('Открыта карточка:', p.name);
        }

        // --- Sound Effect ---
        function playPlaceSound() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.frequency.value = 440;
            gain.gain.value = 0.08;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 0.5);
            osc.stop(audioContext.currentTime + 0.5);
        }

        // --- Texture Cache ---
        const textureCache = new Map();
        function createTextureWithText(text, textColor, bgColor) {
            const cacheKey = `${text}_${textColor}_${bgColor}`;
            if (textureCache.has(cacheKey)) return textureCache.get(cacheKey).clone();
            
            const c = document.createElement('canvas');
            c.width = 512;
            c.height = 256;
            const ctx = c.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, 256);
            gradient.addColorStop(0, bgColor);
            gradient.addColorStop(1, '#0a0a14');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 256);
            ctx.strokeStyle = textColor;
            ctx.lineWidth = 4;
            ctx.shadowColor = textColor;
            ctx.shadowBlur = 15;
            ctx.strokeRect(10, 10, 492, 236);
            ctx.fillStyle = textColor;
            ctx.font = 'bold 52px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = textColor;
            ctx.shadowBlur = 25;
            ctx.fillText(text, 256, 100);
            ctx.font = 'bold 36px "Courier New", monospace';
            ctx.fillText('R.I.P.', 256, 175);
            const texture = new THREE.CanvasTexture(c);
            textureCache.set(cacheKey, texture);
            return texture.clone();
        }

        // --- Tombstone Creation (все части надгробия помечаем как кликабельные) ---
        function createTombstoneMesh(productId) {
            const p = PRODUCTS[productId];
            const group = new THREE.Group();
            const color = new THREE.Color(p.color);
            
            // Постамент
            const baseGeo = new THREE.BoxGeometry(2.5, 0.5, 1.2);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.3, metalness: 0.7 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 0.25;
            base.userData = { isTombstonePart: true, productId: productId };
            group.add(base);
            
            // Неоновая полоса
            const stripeGeo = new THREE.BoxGeometry(2.6, 0.08, 1.3);
            const stripeMat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 1.2, roughness: 0.1, metalness: 0.9 });
            const stripe = new THREE.Mesh(stripeGeo, stripeMat);
            stripe.position.y = 0.5;
            stripe.userData = { isTombstonePart: true, productId: productId };
            group.add(stripe);
            
            // Основная плита
            const stoneGeo = new THREE.BoxGeometry(2, 3, 0.5);
            const nameTexture = createTextureWithText(p.name, p.color, '#1a1a2e');
            const stoneMat = new THREE.MeshStandardMaterial({ map: nameTexture, roughness: 0.4, metalness: 0.4 });
            const stone = new THREE.Mesh(stoneGeo, stoneMat);
            stone.position.y = 2;
            stone.userData = { isTombstonePart: true, productId: productId };
            group.add(stone);
            
            // Крест вертикальный
            const crossVertical = new THREE.BoxGeometry(0.15, 0.8, 0.15);
            const crossHorizontal = new THREE.BoxGeometry(0.5, 0.15, 0.15);
            const crossMat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 1, roughness: 0.2, metalness: 0.8 });
            const crossV = new THREE.Mesh(crossVertical, crossMat);
            crossV.position.y = 3.7;
            crossV.userData = { isTombstonePart: true, productId: productId };
            group.add(crossV);
            const crossH = new THREE.Mesh(crossHorizontal, crossMat);
            crossH.position.set(0, 3.5, 0);
            crossH.userData = { isTombstonePart: true, productId: productId };
            group.add(crossH);
            
            // Неоновая рамка
            const frameGeo = new THREE.BoxGeometry(2.2, 3.2, 0.05);
            const frameMat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 2.5, roughness: 0.1, metalness: 0.9 });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.position.set(0, 2, -0.25);
            frame.userData = { isTombstonePart: true, productId: productId };
            group.add(frame);
            
            // Свечение на земле
            const groundGlowGeo = new THREE.PlaneGeometry(3.5, 2.5);
            const groundGlowMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.25, side: THREE.DoubleSide });
            const groundGlow = new THREE.Mesh(groundGlowGeo, groundGlowMat);
            groundGlow.rotation.x = -Math.PI / 2;
            groundGlow.position.y = 0.01;
            groundGlow.userData = { isTombstonePart: true, productId: productId };
            group.add(groundGlow);
            
            // Свеча
            const candleBase = new THREE.CylinderGeometry(0.15, 0.18, 0.6, 8);
            const candleMat = new THREE.MeshStandardMaterial({ color: 0xf5f5dc, roughness: 0.5 });
            const candle = new THREE.Mesh(candleBase, candleMat);
            candle.position.set(0, 0.35, 0.7);
            candle.userData = { isTombstonePart: true, productId: productId };
            group.add(candle);
            
            // Пламя
            const flameGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const flameMat = new THREE.MeshBasicMaterial({ color: 0xffa500 });
            const flame = new THREE.Mesh(flameGeo, flameMat);
            flame.position.set(0, 0.65, 0.7);
            flame.userData = { isTombstonePart: true, productId: productId };
            group.add(flame);
            
            // Источники света
            const candleLight = new THREE.PointLight(0xffa500, 0.3, 2);
            candleLight.position.set(0, 0.5, 0.7);
            group.add(candleLight);
            
            const pointLight = new THREE.PointLight(color, 0.6, 5);
            pointLight.position.set(0, 1.5, 0.5);
            group.add(pointLight);
            
            // Основная метка для группы
            group.userData = { 
                productId: productId, 
                isTombstone: true,
                isTombstoneGroup: true
            };
            
            group.scale.set(0.1, 0.1, 0.1);
            return group;
        }

        function placeInitialTombstones() {
            tombstones.forEach(t => scene.remove(t));
            tombstones = [];
            currentViewIndex = 0;
            const positions = [
                { product: 'flash',      x: 0,    z: -4.5 },
                { product: 'skype',      x: -3,   z: -4 },
                { product: 'vine',       x: 3,    z: -4 },
                { product: 'googleplus', x: -5,   z: -5.5 },
                { product: 'winphone',   x: 5,    z: -5.5 },
                { product: 'yahoo',      x: -1.5, z: -6.5 },
                { product: 'periscope',  x: 1.5,  z: -6.5 }
            ];
            positions.forEach(pos => {
                const mesh = createTombstoneMesh(pos.product);
                mesh.position.set(pos.x, 0, pos.z);
                scene.add(mesh);
                tombstones.push(mesh);
            });
            updateCounter();
            saveState();
        }

        function placeNewTombstone() {
            const mesh = createTombstoneMesh(selectedProduct);
            const direction = new THREE.Vector3(0, 0, -1);
            direction.applyQuaternion(camera.quaternion);
            mesh.position.copy(camera.position).add(direction.multiplyScalar(3.5));
            mesh.position.y = 0;
            mesh.lookAt(camera.position.x, mesh.position.y, camera.position.z);
            scene.add(mesh);
            tombstones.push(mesh);
            if (tombstones.length > 25) {
                scene.remove(tombstones[0]);
                tombstones.shift();
            }
            updateCounter();
            showToast('🪦 ' + PRODUCTS[selectedProduct].name + ' установлен!');
            vibrate(20);
            playPlaceSound();
            saveState();
        }
        
        function clearAll() {
            tombstones.forEach(t => scene.remove(t));
            tombstones = [];
            currentViewIndex = 0;
            updateCounter();
            showToast('🧹 Кладбище очищено');
            vibrate(50);
            saveState();
        }

        function flyToNextTombstone() {
            if (tombstones.length === 0 || isAnimating) return;
            isAnimating = true;
            const index = currentViewIndex % tombstones.length;
            const target = tombstones[index];
            const targetPos = target.position.clone();
            const cameraTargetPos = targetPos.clone().add(new THREE.Vector3(0, 2.5, 3.5));
            const startPos = camera.position.clone();
            const startTime = Date.now();
            function animateFly() {
                const progress = Math.min((Date.now() - startTime) / 1000, 1);
                const ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                camera.position.lerpVectors(startPos, cameraTargetPos, ease);
                camera.lookAt(targetPos.x, targetPos.y + 1.5, targetPos.z);
                if (progress < 1) requestAnimationFrame(animateFly);
                else { isAnimating = false; showToast('🪦 ' + PRODUCTS[target.userData.productId].name); }
            }
            animateFly();
            currentViewIndex = (currentViewIndex + 1) % tombstones.length;
        }

        // --- State Persistence ---
        function saveState() {
            const state = {
                tombstones: tombstones.map(t => ({
                    productId: t.userData.productId,
                    position: t.position.toArray(),
                    rotation: t.rotation.toArray()
                })),
                selectedProduct: selectedProduct
            };
            localStorage.setItem('cyberGraveyard', JSON.stringify(state));
        }

        function loadState() {
            const saved = localStorage.getItem('cyberGraveyard');
            if (saved) {
                try {
                    const state = JSON.parse(saved);
                    state.tombstones.forEach(data => {
                        const tombstone = createTombstoneMesh(data.productId);
                        tombstone.position.fromArray(data.position);
                        tombstone.rotation.fromArray(data.rotation);
                        scene.add(tombstone);
                        tombstones.push(tombstone);
                    });
                    updateCounter();
                } catch(e) { console.warn('Failed to load state'); }
            }
        }

        // --- Улучшенный Raycaster для кликабельности всего надгробия ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        function handleTombstoneClick(event) {
            if (isAnimating || !currentMode || isDragging) return;
            
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            
            if (event.touches) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }
            
            mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            // Собираем все объекты сцены, которые являются частями надгробий
            const clickableObjects = [];
            scene.traverse(obj => {
                if (obj.isMesh && (obj.userData?.isTombstonePart || obj.userData?.isTombstoneGroup || obj.userData?.isTombstone)) {
                    clickableObjects.push(obj);
                }
                // Также проверяем группы
                if (obj.userData?.isTombstoneGroup || obj.userData?.isTombstone) {
                    clickableObjects.push(obj);
                }
            });
            
            const intersects = raycaster.intersectObjects(clickableObjects, true);
            
            if (intersects.length > 0) {
                // Ищем родительскую группу с productId
                let targetObj = intersects[0].object;
                let productId = null;
                
                // Поднимаемся по иерархии в поисках productId
                while (targetObj) {
                    if (targetObj.userData?.productId) {
                        productId = targetObj.userData.productId;
                        break;
                    }
                    if (targetObj.userData?.isTombstoneGroup && targetObj.userData?.productId) {
                        productId = targetObj.userData.productId;
                        break;
                    }
                    if (targetObj.parent) {
                        targetObj = targetObj.parent;
                    } else {
                        break;
                    }
                }
                
                if (productId && PRODUCTS[productId]) {
                    showInfoCard(productId);
                }
            }
        }
        
        // Обработчики событий с устранением конфликтов
        function onCanvasClick(event) {
            event.preventDefault();
            handleTombstoneClick(event);
        }
        
        function onCanvasTouchEnd(event) {
            if (event.target === canvas && !isDragging && event.changedTouches.length > 0) {
                event.preventDefault();
                handleTombstoneClick(event);
            }
            // Сбрасываем флаг перетаскивания через короткое время
            setTimeout(() => { isDragging = false; }, 100);
        }

        // --- Interaction ---
        canvas.addEventListener('pointerdown', (e) => {
            if (currentMode === '3d' && !isAnimating) {
                isDragging = true;
                lastTouchX = e.clientX;
                lastTouchY = e.clientY;
            }
        });
        
        canvas.addEventListener('pointermove', (e) => {
            if (isDragging && currentMode === '3d') {
                const deltaX = e.clientX - lastTouchX;
                if (Math.abs(deltaX) > 3) {
                    tombstones.forEach(t => { t.rotation.y += deltaX * 0.005; });
                    lastTouchX = e.clientX;
                }
            }
        });
        
        canvas.addEventListener('pointerup', () => {
            setTimeout(() => { isDragging = false; }, 50);
        });
        
        canvas.addEventListener('click', onCanvasClick);
        canvas.addEventListener('touchend', onCanvasTouchEnd);

        // Pinch zoom for 3D
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2 && currentMode === '3d') {
                touchStartDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialCameraPosition = camera.position.clone();
            }
        });
        
        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && touchStartDistance > 0) {
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const scale = currentDistance / touchStartDistance;
                const newZ = Math.max(3, Math.min(8, initialCameraPosition.z * scale));
                camera.position.z = newZ;
                e.preventDefault();
            }
        });

        // --- Gyro for AR (исправлено) ---
        let initialOrientation = null;
        function handleOrientation(event) {
            if (currentMode !== 'ar' || isAnimating) return;
            if (!initialOrientation) {
                initialOrientation = {
                    alpha: event.alpha || 0,
                    beta: event.beta || 0,
                    gamma: event.gamma || 0
                };
                return;
            }
            const alpha = ((event.alpha || 0) - initialOrientation.alpha) * Math.PI / 180;
            const beta = ((event.beta || 0) - initialOrientation.beta) * Math.PI / 180;
            const gamma = ((event.gamma || 0) - initialOrientation.gamma) * Math.PI / 180;
            const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
            const targetQuat = new THREE.Quaternion().setFromEuler(euler);
            camera.quaternion.slerp(targetQuat, 0.3);
        }
        window.addEventListener('deviceorientation', handleOrientation, true);

        // --- Mode Switching ---
        function cleanupResources() {
            if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
            cameraVideo.classList.remove('active');
            initialOrientation = null;
            scene.background = null;
            scene.fog = null;
            renderer.setClearColor(0x000000, 0);
            ground.visible = false;
        }

        async function startARMode() {
            errorMsg.classList.remove('show');
            cleanupResources();
            showLoading(true);
            try {
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: 'environment' } } });
                } catch {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } });
                }
                cameraStream = stream;
                cameraVideo.srcObject = stream;
                await cameraVideo.play();
                currentMode = 'ar';
                startScreen.classList.add('hidden');
                canvas.classList.add('active');
                cameraVideo.classList.add('active');
                topBar.classList.add('visible');
                bottomBar.classList.add('visible');
                counterEl.classList.add('visible');
                arReticle.classList.add('visible');
                scene.background = null;
                scene.fog = null;
                renderer.setClearColor(0x000000, 0);
                ground.visible = false;
                camera.position.set(0, 1.6, 0);
                modeIndicator.textContent = 'AR 📷';
                showToast('📷 AR режим — двигайте телефоном');
                placeInitialTombstones();
            } catch (e) {
                errorMsg.textContent = '⚠ Ошибка камеры. Используйте 3D режим.';
                errorMsg.classList.add('show');
                showLoading(false);
            } finally {
                showLoading(false);
            }
        }

        function start3DMode() {
            cleanupResources();
            currentMode = '3d';
            startScreen.classList.add('hidden');
            canvas.classList.add('active');
            cameraVideo.classList.remove('active');
            topBar.classList.add('visible');
            bottomBar.classList.add('visible');
            counterEl.classList.add('visible');
            arReticle.classList.remove('visible');
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.Fog(0x050510, 5, 25);
            ground.visible = true;
            camera.position.set(0, 1.8, 0);
            camera.lookAt(0, 1, -5);
            modeIndicator.textContent = '3D 🌐';
            showToast('🌐 3D режим — водите пальцем для обзора');
            if (tombstones.length === 0) placeInitialTombstones();
            else loadState();
        }

        // --- Event Listeners UI (с исправленной кнопкой закрытия) ---
        document.getElementById('d3ModeBtn').addEventListener('click', (e) => { e.preventDefault(); start3DMode(); });
        document.getElementById('arModeBtn').addEventListener('click', (e) => { e.preventDefault(); startARMode(); });
        document.getElementById('placeBtn').addEventListener('click', (e) => { e.preventDefault(); if (currentMode) placeNewTombstone(); });
        document.getElementById('clearBtn').addEventListener('click', (e) => { e.preventDefault(); clearAll(); });
        counterEl.addEventListener('click', (e) => { e.preventDefault(); flyToNextTombstone(); });
        
        // Улучшенная кнопка закрытия - несколько способов для надёжности
        if (infoCloseBtn) {
            infoCloseBtn.addEventListener('click', hideInfoCard);
            infoCloseBtn.addEventListener('touchend', hideInfoCard);
            infoCloseBtn.addEventListener('touchstart', (e) => { e.stopPropagation(); });
        }
        
        // Закрытие по клику на оверлей
        infoOverlay.addEventListener('click', hideInfoCard);
        infoOverlay.addEventListener('touchend', hideInfoCard);
        
        // Закрытие по клавише Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && infoCard.classList.contains('visible')) {
                hideInfoCard();
            }
        });
        
        // Выбор продукта
        document.getElementById('productRow').addEventListener('click', (e) => {
            const chip = e.target.closest('.product-chip');
            if (!chip) return;
            document.querySelectorAll('.product-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            selectedProduct = chip.dataset.id;
            vibrate(10);
        });

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            tombstones.forEach(tombstone => {
                if (tombstone.scale.x < 0.5) {
                    const s = Math.min(tombstone.scale.x + 0.06, 0.5);
                    tombstone.scale.set(s, s, s);
                }
                tombstone.children.forEach(child => {
                    if (child.isPointLight && child.color && child.color.getHex() === 0xffa500) {
                        child.intensity = 0.25 + Math.sin(Date.now() * 0.01) * 0.1;
                    }
                });
            });
            stars.rotation.y += 0.0003;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        window.addEventListener('beforeunload', () => { 
            if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
        });
        
        console.log('🪦 Киберкладбище v3.1 — всё надгробие кликабельно, кнопка закрытия исправлена');
        console.log('👆 Кликайте на ЛЮБУЮ часть надгробия');
    </script>
</body>
</html>
