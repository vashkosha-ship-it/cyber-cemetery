<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Киберкладбище AR/3D</title>

    <!-- A-Frame минимальная версия -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <style>
        :root {
            --neon-cyan: #00f7ff;
            --neon-pink: #ff00ff;
            --neon-green: #39ff14;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #050510;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: manipulation;
        }

        #cameraVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            display: none;
            background: #000;
        }

        #cameraVideo.active {
            display: block;
        }

        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050510;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
            padding: 20px;
        }

        .start-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .start-icon {
            font-size: 4rem;
            margin-bottom: 0.5rem;
        }

        .start-title {
            color: #00f7ff;
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-shadow: 0 0 20px #00f7ff;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .start-subtitle {
            color: #667788;
            font-size: 0.7rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .mode-selector {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 280px;
        }

        .mode-btn {
            background: rgba(10, 10, 26, 0.9);
            border: 2px solid rgba(0, 247, 255, 0.3);
            color: #00f7ff;
            padding: 12px 16px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 8px;
            text-shadow: 0 0 8px #00f7ff;
            transition: all 0.3s;
            text-align: center;
            touch-action: manipulation;
        }

        .mode-btn:active {
            background: rgba(0, 247, 255, 0.2);
            transform: scale(0.97);
        }

        .mode-btn.ar-btn {
            border-color: #ff00ff;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 0.65rem;
            margin-top: 0.5rem;
            text-align: center;
            max-width: 280px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        #mainScene {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 1;
            visibility: hidden;
        }

        .top-bar {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(5, 5, 16, 0.8);
            border: 1px solid rgba(0, 247, 255, 0.2);
            border-radius: 8px;
            padding: 6px 12px;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .top-bar.visible {
            opacity: 1;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #39ff14;
            border-radius: 50%;
            box-shadow: 0 0 6px #39ff14;
        }

        .top-title {
            color: #00f7ff;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-shadow: 0 0 6px #00f7ff;
        }

        .mode-indicator {
            color: #ff00ff;
            font-size: 0.6rem;
            padding: 2px 6px;
            border: 1px solid rgba(255, 0, 255, 0.3);
            border-radius: 10px;
        }

        .ar-reticle {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            pointer-events: none;
            z-index: 9;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .ar-reticle.visible {
            opacity: 1;
        }

        .ar-reticle::before,
        .ar-reticle::after {
            content: '';
            position: absolute;
            background: #ff00ff;
            box-shadow: 0 0 8px #ff00ff;
        }

        .ar-reticle::before {
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            transform: translateX(-50%);
        }

        .ar-reticle::after {
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            transform: translateY(-50%);
        }

        .bottom-bar {
            position: fixed;
            bottom: 12px;
            left: 10px;
            right: 10px;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .bottom-bar.visible {
            opacity: 1;
        }

        .product-row {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding: 4px 0;
            pointer-events: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .product-row::-webkit-scrollbar {
            display: none;
        }

        .product-chip {
            flex-shrink: 0;
            background: rgba(10, 10, 26, 0.9);
            border: 1px solid rgba(0, 247, 255, 0.2);
            border-radius: 15px;
            padding: 6px 10px;
            color: #aabbcc;
            font-size: 0.6rem;
            cursor: pointer;
            white-space: nowrap;
            touch-action: manipulation;
        }

        .product-chip.active {
            border-color: #00f7ff;
            box-shadow: 0 0 10px rgba(0, 247, 255, 0.3);
            color: #00f7ff;
            background: rgba(0, 247, 255, 0.1);
        }

        .action-row {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            pointer-events: auto;
        }

        .place-btn {
            flex: 1;
            background: rgba(0, 247, 255, 0.1);
            border: 2px solid #00f7ff;
            color: #00f7ff;
            padding: 10px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 8px;
            text-shadow: 0 0 5px #00f7ff;
            touch-action: manipulation;
        }

        .place-btn:active {
            background: rgba(0, 247, 255, 0.3);
            transform: scale(0.97);
        }

        .clear-btn {
            background: rgba(255, 80, 80, 0.1);
            border: 2px solid rgba(255, 80, 80, 0.5);
            color: #ff6b6b;
            padding: 10px 14px;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 8px;
            touch-action: manipulation;
        }

        .hint {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.55rem;
            margin-top: 4px;
            pointer-events: none;
        }

        .counter {
            position: fixed;
            top: 50px;
            right: 10px;
            background: rgba(5, 5, 16, 0.8);
            border: 1px solid rgba(255, 0, 255, 0.3);
            border-radius: 15px;
            padding: 4px 10px;
            color: #ff00ff;
            font-size: 0.65rem;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .counter.visible {
            opacity: 1;
        }

        .toast {
            position: fixed;
            bottom: 160px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(5, 5, 16, 0.9);
            border: 1px solid #ff00ff;
            color: #ff00ff;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.6rem;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <video id="cameraVideo" autoplay playsinline muted></video>

    <div class="start-screen" id="startScreen">
        <div class="start-icon">🪦</div>
        <div class="start-title">КИБЕРКЛАДБИЩЕ</div>
        <div class="start-subtitle">Выберите режим работы</div>
        <div class="mode-selector">
            <button class="mode-btn ar-btn" id="arModeBtn">📷 AR РЕЖИМ</button>
            <button class="mode-btn" id="d3ModeBtn">🌐 3D РЕЖИМ</button>
        </div>
        <div class="error-msg" id="errorMsg"></div>
    </div>

    <a-scene
        id="mainScene"
        embedded
        vr-mode-ui="enabled: false"
        renderer="antialias: false; alpha: true; precision: medium"
        background="color: #050510"
    >
        <a-entity id="mainCamera" camera position="0 1.6 0" look-controls="enabled: false"></a-entity>
        <a-entity id="graveyard"></a-entity>
        
        <a-plane
            id="groundPlane"
            position="0 0 0"
            rotation="-90 0 0"
            width="30"
            height="30"
            color="#0a0a1e"
            visible="false"
        ></a-plane>
        
        <a-light type="ambient" color="#444466" intensity="0.8"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.6" position="1 3 2"></a-light>
        <a-light type="point" color="#ff00ff" intensity="0.3" position="0 2 0" distance="8"></a-light>
    </a-scene>

    <div class="top-bar" id="topBar">
        <div style="display:flex;align-items:center;gap:6px;">
            <div class="dot"></div>
            <span class="top-title">КИБЕРКЛАДБИЩЕ</span>
        </div>
        <span class="mode-indicator" id="modeIndicator">3D</span>
    </div>

    <div class="ar-reticle" id="arReticle"></div>
    <div class="counter" id="counter">🪦 0</div>
    <div class="toast" id="toast"></div>

    <div class="bottom-bar" id="bottomBar">
        <div class="product-row" id="productRow">
            <span class="product-chip active" data-id="skype">📞 Skype</span>
            <span class="product-chip" data-id="flash">⚡ Flash</span>
            <span class="product-chip" data-id="vine">🎥 Vine</span>
            <span class="product-chip" data-id="googleplus">🔵 Google+</span>
            <span class="product-chip" data-id="winphone">📱 WinPhone</span>
            <span class="product-chip" data-id="yahoo">💬 Yahoo</span>
            <span class="product-chip" data-id="periscope">📡 Periscope</span>
            <span class="product-chip" data-id="clubhouse">🎙️ Clubhouse</span>
        </div>
        <div class="action-row">
            <button class="place-btn" id="placeBtn">[ УСТАНОВИТЬ ]</button>
            <button class="clear-btn" id="clearBtn">✕</button>
        </div>
        <div class="hint">Нажмите УСТАНОВИТЬ для размещения</div>
    </div>

    <script>
        (function() {
            const PRODUCTS = {
                skype:      { name: 'SKYPE',     years: '2003-2025', cause: 'УБИТ MICROSOFT',  color: '#4da6ff', emoji: '📞' },
                flash:      { name: 'FLASH',     years: '1996-2020', cause: 'УБИТ APPLE',      color: '#ff5555', emoji: '⚡' },
                vine:       { name: 'VINE',      years: '2013-2017', cause: 'УБИТ TIKTOK',     color: '#39ff14', emoji: '🎥' },
                googleplus: { name: 'GOOGLE+',   years: '2011-2019', cause: 'НИКОМУ НЕ НУЖЕН', color: '#ff4444', emoji: '🔵' },
                winphone:   { name: 'WIN PHONE', years: '2010-2019', cause: 'БЕЗ ПРИЛОЖЕНИЙ',  color: '#00a4ef', emoji: '📱' },
                yahoo:      { name: 'YAHOO MSG', years: '1998-2018', cause: 'ЭПОХА УШЛА',      color: '#9b59b6', emoji: '💬' },
                periscope:  { name: 'PERISCOPE', years: '2015-2021', cause: 'ЭФИР ОПУСТЕЛ',    color: '#e74c3c', emoji: '📡' },
                clubhouse:  { name: 'CLUBHOUSE', years: '2020-2023', cause: 'ТИШИНА',          color: '#f39c12', emoji: '🎙️' }
            };

            let selectedProduct = 'skype';
            let currentMode = '';
            let cameraStream = null;
            let sceneLoaded = false;

            const startScreen = document.getElementById('startScreen');
            const mainScene = document.getElementById('mainScene');
            const graveyard = document.getElementById('graveyard');
            const mainCamera = document.getElementById('mainCamera');
            const groundPlane = document.getElementById('groundPlane');
            const cameraVideo = document.getElementById('cameraVideo');
            const arReticle = document.getElementById('arReticle');
            const topBar = document.getElementById('topBar');
            const bottomBar = document.getElementById('bottomBar');
            const counterEl = document.getElementById('counter');
            const modeIndicator = document.getElementById('modeIndicator');
            const toast = document.getElementById('toast');
            const errorMsg = document.getElementById('errorMsg');

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => toast.classList.remove('show'), 2000);
            }

            function createTombstone(productId, x, y, z, yaw) {
                const p = PRODUCTS[productId];
                const group = document.createElement('a-entity');
                group.setAttribute('position', x + ' ' + y + ' ' + z);
                group.setAttribute('rotation', '0 ' + (yaw || 0) + ' 0');
                group.setAttribute('scale', '0.5 0.5 0.5');
                group.setAttribute('class', 'tombstone');

                // Основание
                const base = document.createElement('a-box');
                base.setAttribute('width', '2');
                base.setAttribute('height', '0.3');
                base.setAttribute('depth', '0.8');
                base.setAttribute('position', '0 0.15 0');
                base.setAttribute('color', '#0a0a14');
                group.appendChild(base);

                // Плита
                const block = document.createElement('a-box');
                block.setAttribute('width', '1.8');
                block.setAttribute('height', '2.5');
                block.setAttribute('depth', '0.3');
                block.setAttribute('position', '0 1.55 0');
                block.setAttribute('color', '#1a1a2e');
                group.appendChild(block);

                // Рамка
                const frame = document.createElement('a-box');
                frame.setAttribute('width', '1.95');
                frame.setAttribute('height', '2.65');
                frame.setAttribute('depth', '0.08');
                frame.setAttribute('position', '0 1.55 -0.15');
                frame.setAttribute('color', p.color);
                frame.setAttribute('material', 'emissive: ' + p.color + '; emissiveIntensity: 1.5; opacity: 0.85');
                group.appendChild(frame);

                // Эмодзи
                const emoji = document.createElement('a-text');
                emoji.setAttribute('value', p.emoji);
                emoji.setAttribute('position', '0 2.6 0.16');
                emoji.setAttribute('align', 'center');
                emoji.setAttribute('width', '3');
                emoji.setAttribute('scale', '1.5 1.5 1');
                group.appendChild(emoji);

                // Название
                const name = document.createElement('a-text');
                name.setAttribute('value', p.name);
                name.setAttribute('position', '0 2 0.16');
                name.setAttribute('align', 'center');
                name.setAttribute('width', '4');
                name.setAttribute('color', p.color);
                name.setAttribute('scale', '1.2 1.2 1');
                group.appendChild(name);

                // Годы
                const years = document.createElement('a-text');
                years.setAttribute('value', p.years);
                years.setAttribute('position', '0 1.3 0.16');
                years.setAttribute('align', 'center');
                years.setAttribute('width', '3.5');
                years.setAttribute('color', '#aabbcc');
                group.appendChild(years);

                // Причина
                const cause = document.createElement('a-text');
                cause.setAttribute('value', p.cause);
                cause.setAttribute('position', '0 0.7 0.16');
                cause.setAttribute('align', 'center');
                cause.setAttribute('width', '3');
                cause.setAttribute('color', '#8899aa');
                group.appendChild(cause);

                // Анимация появления
                group.setAttribute('animation', 'property: scale; from: 0.1 0.1 0.1; to: 0.5 0.5 0.5; dur: 600; easing: easeOutBack');

                graveyard.appendChild(group);
                return group;
            }

            function placeInitialTombstones() {
                // Очищаем
                while (graveyard.firstChild) {
                    graveyard.removeChild(graveyard.firstChild);
                }

                // Создаём стартовые надгробия перед камерой
                const initialSet = [
                    { product: 'flash',      x: 0,    y: 0, z: -4, yaw: 0 },
                    { product: 'skype',      x: -2.5, y: 0, z: -3.5, yaw: 15 },
                    { product: 'vine',       x: 2.5,  y: 0, z: -3.5, yaw: -15 },
                    { product: 'googleplus', x: -4,   y: 0, z: -5, yaw: 25 },
                    { product: 'winphone',   x: 4,    y: 0, z: -5, yaw: -25 },
                    { product: 'yahoo',      x: -1.5, y: 0, z: -6, yaw: 10 },
                    { product: 'periscope',  x: 1.5,  y: 0, z: -6, yaw: -10 }
                ];

                initialSet.forEach(item => {
                    createTombstone(item.product, item.x, item.y, item.z, item.yaw);
                });

                updateCounter();
            }

            function placeNewTombstone() {
                if (!sceneLoaded) return;
                
                // Получаем позицию камеры
                const camPos = new THREE.Vector3();
                mainCamera.object3D.getWorldPosition(camPos);
                
                // Размещаем перед камерой
                const quat = new THREE.Quaternion();
                mainCamera.object3D.getWorldQuaternion(quat);
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(quat);
                
                const distance = currentMode === 'ar' ? 3 : 3;
                const x = camPos.x + forward.x * distance;
                const z = camPos.z + forward.z * distance;
                const y = currentMode === 'ar' ? camPos.y - 0.5 : 0;
                
                const yaw = Math.atan2(forward.x, forward.z) * 180 / Math.PI;
                
                createTombstone(selectedProduct, x, y, z, yaw);
                updateCounter();
                
                // Удаляем старые если больше 25
                const all = graveyard.querySelectorAll('.tombstone');
                if (all.length > 25) {
                    all[0].parentNode.removeChild(all[0]);
                    updateCounter();
                }
                
                showToast('🪦 ' + PRODUCTS[selectedProduct].name + ' установлен!');
                if (navigator.vibrate) navigator.vibrate(20);
            }

            function updateCounter() {
                const count = graveyard.querySelectorAll('.tombstone').length;
                counterEl.textContent = '🪦 ' + count;
            }

            function clearAll() {
                while (graveyard.firstChild) {
                    graveyard.removeChild(graveyard.firstChild);
                }
                updateCounter();
                showToast('🧹 Кладбище очищено');
                if (navigator.vibrate) navigator.vibrate(50);
            }

            function start3DMode() {
                currentMode = '3d';
                startScreen.classList.add('hidden');
                mainScene.style.visibility = 'visible';
                topBar.classList.add('visible');
                bottomBar.classList.add('visible');
                counterEl.classList.add('visible');
                arReticle.classList.remove('visible');
                cameraVideo.classList.remove('active');

                mainScene.setAttribute('background', 'color: #050510');
                mainCamera.setAttribute('position', '0 1.6 0');
                mainCamera.setAttribute('look-controls', 'enabled: true; magicWindowTrackingEnabled: false');
                groundPlane.setAttribute('visible', 'true');
                modeIndicator.textContent = '3D 🌐';
                showToast('🌐 3D режим');

                // Сразу ставим надгробия
                setTimeout(placeInitialTombstones, 100);
            }

            async function startARMode() {
                errorMsg.classList.remove('show');
                
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: { ideal: 'environment' },
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        },
                        audio: false
                    });
                    
                    cameraStream = stream;
                    cameraVideo.srcObject = stream;
                    await cameraVideo.play();

                    currentMode = 'ar';
                    startScreen.classList.add('hidden');
                    mainScene.style.visibility = 'visible';
                    cameraVideo.classList.add('active');
                    topBar.classList.add('visible');
                    bottomBar.classList.add('visible');
                    counterEl.classList.add('visible');
                    arReticle.classList.add('visible');

                    mainScene.removeAttribute('background');
                    if (mainScene.renderer) {
                        mainScene.renderer.setClearColor(0x000000, 0);
                    }

                    groundPlane.setAttribute('visible', 'false');
                    mainCamera.setAttribute('position', '0 1.6 0');
                    mainCamera.setAttribute('look-controls', 'enabled: true; magicWindowTrackingEnabled: true');
                    modeIndicator.textContent = 'AR 📷';
                    showToast('📷 AR режим');

                    // Ставим надгробия после активации камеры
                    setTimeout(() => {
                        placeInitialTombstones();
                    }, 500);

                } catch (e) {
                    errorMsg.textContent = '⚠ Ошибка камеры. Используйте 3D режим.';
                    errorMsg.classList.add('show');
                }
            }

            // Обработчики событий
            document.getElementById('d3ModeBtn').addEventListener('click', start3DMode);
            document.getElementById('d3ModeBtn').addEventListener('touchend', (e) => {
                e.preventDefault();
                start3DMode();
            });

            document.getElementById('arModeBtn').addEventListener('click', startARMode);
            document.getElementById('arModeBtn').addEventListener('touchend', (e) => {
                e.preventDefault();
                startARMode();
            });

            document.getElementById('placeBtn').addEventListener('click', placeNewTombstone);
            document.getElementById('placeBtn').addEventListener('touchend', (e) => {
                e.preventDefault();
                placeNewTombstone();
            });

            document.getElementById('clearBtn').addEventListener('click', clearAll);
            document.getElementById('clearBtn').addEventListener('touchend', (e) => {
                e.preventDefault();
                clearAll();
            });

            document.getElementById('productRow').addEventListener('click', (e) => {
                const chip = e.target.closest('.product-chip');
                if (!chip) return;
                document.querySelectorAll('.product-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                selectedProduct = chip.dataset.id;
                if (navigator.vibrate) navigator.vibrate(10);
            });

            // Сцена загружена
            mainScene.addEventListener('loaded', () => {
                sceneLoaded = true;
            });

            // Очистка при уходе
            window.addEventListener('beforeunload', () => {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(t => t.stop());
                }
            });

        })();
    </script>
</body>
</html>
